packages:
  - "packages/*"
  - "internal-packages/*"
  - "apps/**"
  - "docs"
  - "!packages/cli-v3/e2e/**"

catalog:
  typescript: 7.0.2

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - trigger.dev
  - "@trigger.dev/*"
  - "@trigger.dev/platform"
  - "next"
  - "@next/*"
  - "agentcrumbs"
  - "tsdown"
  - "secure-exec"
  - "@secure-exec/*"
preferOffline: true

linkWorkspacePackages: false
# Keep React types out of the hidden hoist so packages without an @types/react peer
# (framer-motion, lucide-react) fall back to the root React 18 types, not the docs app's React 19 types.
hoistPattern:
  - "*"
  - "!@types/react"
  - "!@types/react-dom"
# next has no @types/react peer, so without the hoist it would fall back to the root React 18 types.
packageExtensions:
  next:
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true
publicHoistPattern:
  - "*prisma*"
preferWorkspacePackages: true
sideEffectsCache: false
blockExoticSubdeps: true
