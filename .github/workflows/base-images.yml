name: 🐳 Deploy base images

# Publishes the base images that deployed task containers build on
# (triggerdotdev/node:<major>-bookworm and triggerdotdev/bun:<line>-bookworm,
# each with a -build toolchain variant) to Docker Hub. Tags are mutable and
# rebuilt in place; the CLI pins images by digest, so consumers are unaffected
# until a digest bump ships in a release.
#
# Packages install from a Debian snapshot timestamp (recorded in the
# dev.trigger.debian-snapshot image label and the job summary), and layers are
# exported with normalized timestamps, so any published image can be rebuilt
# from the recorded inputs and verified layer for layer.

on:
  workflow_dispatch:
    inputs:
      debian_snapshot:
        description: "Debian snapshot timestamp (YYYYMMDDTHHMMSSZ). Defaults to yesterday 00:00 UTC."
        required: false
        type: string
  schedule:
    # Weekly rebuild so packages pick up Debian security updates
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "base-images/**"
      - ".github/workflows/base-images.yml"
  pull_request:
    paths:
      - "base-images/**"
      - ".github/workflows/base-images.yml"

concurrency:
  group: base-images-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.config.outputs.images }}
      packages: ${{ steps.config.outputs.packages }}
      build_packages: ${{ steps.config.outputs.build_packages }}
      suite: ${{ steps.config.outputs.suite }}
      snapshot: ${{ steps.config.outputs.snapshot }}
      push: ${{ steps.config.outputs.push }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read image matrix and resolve snapshot
        id: config
        env:
          SNAPSHOT_INPUT: ${{ inputs.debian_snapshot }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PACKAGES="$(jq -r '.packages' base-images/images.json)"
          BUILD_PACKAGES="$(jq -r '.buildPackages' base-images/images.json)"
          SUITE="$(jq -r '.suite' base-images/images.json)"

          # Values land in build args and shell lines; keep them boring
          echo "$PACKAGES" | grep -qE '^[a-z0-9 .+-]+$' || { echo "invalid packages value"; exit 1; }
          echo "$BUILD_PACKAGES" | grep -qE '^[a-z0-9 .+-]+$' || { echo "invalid buildPackages value"; exit 1; }
          echo "$SUITE" | grep -qE '^[a-z]+$' || { echo "invalid suite value"; exit 1; }

          SNAPSHOT="$SNAPSHOT_INPUT"
          if [ -z "$SNAPSHOT" ]; then
            SNAPSHOT="$(date -u -d yesterday +%Y%m%dT000000Z)"
          fi
          echo "$SNAPSHOT" | grep -qE '^[0-9]{8}T[0-9]{6}Z$' || { echo "invalid debian_snapshot: $SNAPSHOT"; exit 1; }

          # Only publish from main; pull requests validate the build without pushing
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PUSH=false
          else
            PUSH=true
          fi

          {
            echo "images=$(jq -c '.images' base-images/images.json)"
            echo "packages=$PACKAGES"
            echo "build_packages=$BUILD_PACKAGES"
            echo "suite=$SUITE"
            echo "snapshot=$SNAPSHOT"
            echo "push=$PUSH"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.setup.outputs.images) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 🐳 Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: 🐳 Login to Docker Hub
        if: needs.setup.outputs.push == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐳 Build and push runtime image
        id: build_runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: base-images
          file: base-images/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          provenance: false
          # rewrite-timestamp + SOURCE_DATE_EPOCH make layer blobs a pure
          # function of the build inputs, so published layers are verifiable
          outputs: type=image,push=${{ needs.setup.outputs.push }},rewrite-timestamp=true
          tags: triggerdotdev/${{ matrix.image.repo }}:${{ matrix.image.tag }}
          cache-from: type=gha,scope=base-${{ matrix.image.repo }}-${{ matrix.image.tag }}
          cache-to: type=gha,scope=base-${{ matrix.image.repo }}-${{ matrix.image.tag }},mode=max
          build-args: |
            BASE_IMAGE=${{ matrix.image.base }}
            DEBIAN_SNAPSHOT=${{ needs.setup.outputs.snapshot }}
            DEBIAN_SUITE=${{ needs.setup.outputs.suite }}
            PACKAGES=${{ needs.setup.outputs.packages }}
            SOURCE_DATE_EPOCH=0
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            dev.trigger.debian-snapshot=${{ needs.setup.outputs.snapshot }}

      - name: 🐳 Build and push build-variant image
        id: build_toolchain
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: base-images
          file: base-images/Dockerfile
          target: build
          platforms: linux/amd64,linux/arm64
          provenance: false
          outputs: type=image,push=${{ needs.setup.outputs.push }},rewrite-timestamp=true
          tags: triggerdotdev/${{ matrix.image.repo }}:${{ matrix.image.tag }}-build
          cache-from: type=gha,scope=base-${{ matrix.image.repo }}-${{ matrix.image.tag }}
          cache-to: type=gha,scope=base-${{ matrix.image.repo }}-${{ matrix.image.tag }},mode=max
          build-args: |
            BASE_IMAGE=${{ matrix.image.base }}
            DEBIAN_SNAPSHOT=${{ needs.setup.outputs.snapshot }}
            DEBIAN_SUITE=${{ needs.setup.outputs.suite }}
            PACKAGES=${{ needs.setup.outputs.packages }}
            BUILD_PACKAGES=${{ needs.setup.outputs.build_packages }}
            SOURCE_DATE_EPOCH=0
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            dev.trigger.debian-snapshot=${{ needs.setup.outputs.snapshot }}

      - name: 🔏 Attest runtime image provenance
        if: needs.setup.outputs.push == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: index.docker.io/triggerdotdev/${{ matrix.image.repo }}
          subject-digest: ${{ steps.build_runtime.outputs.digest }}
          push-to-registry: false

      - name: 🔏 Attest build-variant image provenance
        if: needs.setup.outputs.push == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: index.docker.io/triggerdotdev/${{ matrix.image.repo }}
          subject-digest: ${{ steps.build_toolchain.outputs.digest }}
          push-to-registry: false

      - name: 📋 Record digests
        if: needs.setup.outputs.push == 'true'
        env:
          IMAGE_REPO: ${{ matrix.image.repo }}
          IMAGE_TAG: ${{ matrix.image.tag }}
          RUNTIME_DIGEST: ${{ steps.build_runtime.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build_toolchain.outputs.digest }}
          SNAPSHOT: ${{ needs.setup.outputs.snapshot }}
        run: |
          {
            echo "### triggerdotdev/$IMAGE_REPO:$IMAGE_TAG"
            echo '```'
            echo "runtime: $RUNTIME_DIGEST"
            echo "build:   $BUILD_DIGEST"
            echo "debian snapshot: $SNAPSHOT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
