name: 🗺️ Observability Map

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/webapp/app/routes/**"
      - "internal-packages/observability-map/**"

concurrency:
  group: observability-map-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The tree-scale mutation corpus: every known laundering shape applied to the whole route tree,
  # asserting the score does not rise. Roughly three minutes, which is why it is gated out of the
  # package's default `pnpm test` and run here instead. Unlike the report job below it has no token
  # to lose, so it runs for fork PRs too, and unlike the report job it is allowed to fail the build.
  mutation-corpus:
    name: 🧬 Mutation corpus
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: ⎔ Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: ⎔ Setup node
        uses: WarpBuilds/setup-node@bc639b444d583175926b588962199c247d23e8d3 # v6
        with:
          node-version: 24.18.0
          cache: "pnpm"

      - name: 📥 Download deps
        run: pnpm install --frozen-lockfile

      - name: 🧬 Run the corpus
        env:
          OBS_MAP_MUTATION_CORPUS: "1"
        run: |
          pnpm --filter @internal/observability-map exec vitest run \
            test/mutationCorpus.test.ts --testTimeout=120000 --disable-console-intercept

  report:
    runs-on: warp-ubuntu-latest-x64-4x
    # Only this job comments, so only this job gets the write.
    permissions:
      contents: read
      pull-requests: write
    # Fork PRs get a read-only token, so the comment cannot post. Skipping the job beats a red x.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ⎔ Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.2

      - name: ⎔ Setup node
        uses: WarpBuilds/setup-node@bc639b444d583175926b588962199c247d23e8d3 # v6
        with:
          node-version: 24.18.0
          cache: "pnpm"

      - name: 📥 Download deps
        run: pnpm install --frozen-lockfile

      # Guarded rather than allowed to fail: this job must never block a pull request. The failure
      # is not swallowed either, the render step below turns a missing head report into a comment
      # saying so, because a swallowed failure with no comment is the outcome nobody wants.
      - name: 🔎 Scan head
        run: |
          if pnpm --filter @internal/observability-map exec tsx src/cli.ts --json --no-write \
            > /tmp/head.json.partial; then
            mv /tmp/head.json.partial /tmp/head.json
          else
            rm -f /tmp/head.json /tmp/head.json.partial
            echo "head scan failed; the comment will say the report is stale for this run" >&2
          fi

      - name: 🔎 Scan base with the head's scanner
        run: |
          if git worktree add /tmp/base-tree ${{ github.event.pull_request.base.sha }} \
            && pnpm --filter @internal/observability-map exec tsx src/cli.ts --json --no-write \
              --routes=/tmp/base-tree/apps/webapp/app/routes > /tmp/base.json; then
            :
          else
            echo "-" > /tmp/base.json || true
            echo "base scan failed or the worktree could not be added; falling back to no base" >&2
          fi

      # Looked up before the render step because the render step needs it: with no delta to report,
      # a pull request that already has a comment gets a resolved state rather than being left with
      # findings that no longer exist, and one that does not gets nothing at all. The upsert step
      # reuses the id rather than asking again.
      - name: 🔍 Look for a comment from an earlier push
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          rm -f /tmp/existing-comment-id
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- observability-map-report -->"))][0].id // empty' \
            > /tmp/existing-comment-id.partial; then
            mv /tmp/existing-comment-id.partial /tmp/existing-comment-id
          else
            rm -f /tmp/existing-comment-id.partial
            echo "comment lookup failed; assuming a comment exists so a stale one still gets replaced" >&2
          fi

      # continue-on-error for the same reason as the scan: a rendering bug must not turn the job
      # red. An empty /tmp/comment.md means there is nothing to post, which is a decision
      # prCommentCli makes, not this shell.
      - name: 📝 Render comment
        continue-on-error: true
        run: |
          rm -f /tmp/comment.md
          render() { pnpm --filter @internal/observability-map exec tsx src/report/prCommentCli.ts "$@"; }

          if [ ! -s /tmp/head.json ]; then
            render --scan-failed > /tmp/comment.md
            exit 0
          fi

          base=/tmp/base.json
          if [ ! -s /tmp/base.json ] || [ "$(cat /tmp/base.json)" = "-" ]; then
            base="-"
          fi

          # An absent file means the lookup itself failed, and assuming there is a comment is the
          # safer half of that guess: it can post a redundant resolved state, not leave a stale one.
          flags=()
          if [ ! -f /tmp/existing-comment-id ] || [ -s /tmp/existing-comment-id ]; then
            flags=(--existing-comment)
          fi

          if render /tmp/head.json "$base" "${flags[@]}" > /tmp/comment.md.partial; then
            mv /tmp/comment.md.partial /tmp/comment.md
          else
            rm -f /tmp/comment.md.partial
            echo "render failed; falling back to the stale-report comment" >&2
            render --scan-failed > /tmp/comment.md
          fi

      # continue-on-error for the same reason: a transient gh api failure (rate limit, network)
      # must not fail the job either. Worst case, the PR gets no comment this run.
      - name: 💬 Upsert PR comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s /tmp/comment.md ]; then
            echo "nothing to post: this pull request does not move the report"
            exit 0
          fi
          existing=""
          if [ -f /tmp/existing-comment-id ]; then
            existing=$(cat /tmp/existing-comment-id)
          fi
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@/tmp/comment.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@/tmp/comment.md
          fi
