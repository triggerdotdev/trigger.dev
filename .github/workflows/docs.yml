name: 📚 Docs Checks

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "apps/docs/**"
  # No paths filter on pull requests or the merge queue: `check` can be a required check, and a
  # workflow a paths filter skips leaves a required check pending. `changes` skips `check` (a pass)
  # instead.
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the merge group's commits, to diff them
      pull-requests: read # a pull request's changed files
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # A merge group is diffed in git (as in pr_checks.yml); a pull request through the API.
      - name: 📥 Checkout repository
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20
          filter: blob:none
          persist-credentials: false

      # Renamed files match on their old path too, so moving a page out of docs/ still runs the check.
      - name: 🔎 Docs changed?
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docs:
              - ".github/workflows/docs.yml"
              - "docs/**"
              - "apps/docs/**"

  # Builds the docs site (apps/docs) and runs its checks: every internal link and #anchor
  # resolves, every published docs URL and redirect still answers, and the MCP endpoint works.
  check:
    name: check
    needs: changes
    # Pushes (paths-filtered above) skip `changes`. A pull request or merge group skips this only
    # when `changes` found no docs files; if `changes` failed, this runs.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.docs != 'false') }}
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⎔ Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.2

      - name: ⎔ Setup node
        uses: WarpBuilds/setup-node@2867cf8f859d73439e1ad18b542617e5a29f0f10 # v7.0.0
        with:
          node-version: 24.22.1
          cache: "pnpm"

      # Turbopack and Twoslash caches: a warm build takes about a quarter of a cold one's time and
      # half its memory. Keyed on the lockfile and the docs sources; any older docs cache still helps.
      - name: 💾 Restore the docs build cache
        uses: WarpBuilds/cache@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: apps/docs/.next/cache
          key: docs-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**', 'docs/**') }}
          restore-keys: |
            docs-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: 📦 Install the docs site
        run: pnpm install --frozen-lockfile --filter docs-site...

      # Code samples get type hovers checked against the SDK's own types.
      - name: 🏗️ Build the SDK types
        run: pnpm --filter docs-site build:sdk

      - name: 🧪 Unit tests
        run: pnpm --filter docs-site test

      - name: 🏗️ Build the docs site
        run: pnpm --filter docs-site build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: 🔗 Check links, URLs and MCP
        run: pnpm --filter docs-site check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
