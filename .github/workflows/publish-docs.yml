name: 📚 Publish docs

# Docs-only commits on main publish on merge. Anything else waits for a
# docs-release-* tag. See .github/scripts/publish-docs.sh.
#
# Every new docs-live commit is also deployed as the docs site's (apps/docs) production
# deployment, checked before it takes the production domain. That job skips with a notice
# until its secrets exist: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_DOCS_PROJECT_ID and
# VERCEL_AUTOMATION_BYPASS_SECRET.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
    tags:
      - "docs-release-*"
  workflow_dispatch:

# Writes docs-live (Mintlify's GitHub app deploys from it) and comments on waiting commits.
permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: warp-ubuntu-latest-x64-2x
    outputs:
      publish_sha: ${{ steps.build.outputs.publish_sha }}
      deploy_sha: ${{ steps.target.outputs.deploy_sha }}
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 📦 Install Mintlify
        working-directory: ${{ runner.temp }}
        env:
          COREPACK_HOME: ${{ runner.temp }}/mintlify-corepack
          NPM_CONFIG_CACHE: ${{ runner.temp }}/mintlify-npm-cache
          NPM_CONFIG_GLOBALCONFIG: /dev/null
          NPM_CONFIG_USERCONFIG: /dev/null
          PNPM_HOME: ${{ runner.temp }}/mintlify-pnpm
        run: |
          mkdir -p "$RUNNER_TEMP/mintlify-tool"
          printf '{"private":true}\n' >"$RUNNER_TEMP/mintlify-tool/package.json"
          corepack pnpm@10.33.2 --dir "$RUNNER_TEMP/mintlify-tool" add \
            --save-exact \
            --store-dir "$RUNNER_TEMP/mintlify-pnpm-store" \
            --registry=https://registry.npmjs.org/ \
            mintlify@4.0.393

      - name: 🏗️ Build the docs to publish
        id: build
        run: |
          export LINK_CHECK_CMD="\"$RUNNER_TEMP/mintlify-tool/node_modules/.bin/mintlify\" broken-links"
          export RESULT_FILE="$GITHUB_OUTPUT"
          export REPORT_FILE="$GITHUB_STEP_SUMMARY"
          export NEW_WAITING_FILE="$RUNNER_TEMP/new-waiting"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            .github/scripts/publish-docs.sh auto
            exit 0
          fi
          .github/scripts/publish-docs.sh check-tag "$GITHUB_SHA"
          release=$(.github/scripts/publish-docs.sh release)
          .github/scripts/publish-docs.sh build "$release"

      - name: 🚀 Push docs-live
        if: steps.build.outputs.publish_sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_SHA: ${{ steps.build.outputs.publish_sha }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "$PUBLISH_SHA:refs/heads/docs-live"

      # A manual run with nothing new to publish redeploys docs-live as it is: the way to recover
      # a production deploy that a failed or skipped run left behind.
      - name: 🎯 Pick the tree to deploy
        id: target
        env:
          PUBLISH_SHA: ${{ steps.build.outputs.publish_sha }}
        run: |
          sha="$PUBLISH_SHA"
          if [ -z "$sha" ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            sha=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/docs-live | cut -f1)
          fi
          echo "deploy_sha=$sha" >> "$GITHUB_OUTPUT"

      # Comments are a courtesy: a failed one must not stop the deploy of what was just pushed.
      - name: 💬 Comment on docs-only commits that are waiting
        if: steps.build.outputs.publish_sha != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ -s "$RUNNER_TEMP/new-waiting" ]] || exit 0
          while IFS=$'\t' read -r sha reason; do
            [[ -n "$sha" ]] || continue
            if [[ "$reason" == conflict:* ]]; then
              why="it conflicts with unpublished changes to ${reason#conflict: }"
            else
              why="it would leave a broken link until other unpublished docs go live"
            fi
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/comments" \
              -f body="This docs-only change is waiting for the next docs release: $why. It will go live with the next \`docs-release-*\` tag that includes it." \
              >/dev/null
          done <"$RUNNER_TEMP/new-waiting"

  # Builds the tree just pushed to docs-live, deploys it without the production domain, checks
  # the deployment, then promotes it. A failed step leaves the previous deployment serving.
  deploy-site:
    name: deploy-site
    needs: publish
    # Pushes, tags and manual runs only: never on a pull request, which can't reach these secrets anyway.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.publish.outputs.deploy_sha != ''
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 20
    permissions:
      contents: read
    # One production deploy at a time, in order, so an older tree never promotes last.
    concurrency:
      group: docs-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
      VERCEL_CLI: vercel@65.14.0
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: 🔑 Check deploy settings
        id: config
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice title=Docs site deploy skipped::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_DOCS_PROJECT_ID is not set."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📥 Checkout docs-live
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.deploy_sha }}
          # History (without old file contents) gives each page its last-modified date in the
          # sitemap, JSON-LD and .md; a shallow clone builds without them.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: ⎔ Setup pnpm
        if: steps.config.outputs.enabled == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.2

      - name: ⎔ Setup node
        if: steps.config.outputs.enabled == 'true'
        uses: WarpBuilds/setup-node@2867cf8f859d73439e1ad18b542617e5a29f0f10 # v7.0.0
        with:
          node-version: 24.22.1
          cache: "pnpm"

      - name: 💾 Restore the docs build cache
        if: steps.config.outputs.enabled == 'true'
        uses: WarpBuilds/cache@dad44e2487e9dc889ad6e6bd198e77bb2d828eee # v2.0.0
        with:
          path: apps/docs/.next/cache
          key: docs-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**', 'docs/**') }}
          restore-keys: |
            docs-next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # The project's root directory is apps/docs; its vercel.json installs only the docs site.
      - name: ⚙️ Pull project settings
        if: steps.config.outputs.enabled == 'true'
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"

      # The build stops if a production setting (Ask AI, its limits, analytics) is missing.
      - name: 🏗️ Build
        if: steps.config.outputs.enabled == 'true'
        env:
          VERCEL_ENV: production
        run: pnpm dlx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: 🚀 Deploy without the production domain
        id: deploy
        if: steps.config.outputs.enabled == 'true'
        run: |
          url=$(pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 🔗 Check URLs, MCP and headers on the deployment
        if: steps.config.outputs.enabled == 'true'
        working-directory: apps/docs
        env:
          URL: ${{ steps.deploy.outputs.url }}
          # Deployment URLs sit behind the project's Vercel Authentication until promoted.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node scripts/check-urls.mjs "$URL/docs" --live
          node scripts/check-mcp.mjs "$URL/docs"
          node scripts/check-headers.mjs "$URL/docs"

      - name: ✅ Promote to production
        if: steps.config.outputs.enabled == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PUBLISH_SHA: ${{ needs.publish.outputs.deploy_sha }}
        run: |
          # A rerun of an older run must not put an older tree back over a newer one.
          head=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/docs-live | cut -f1)
          if [ "$head" != "$PUBLISH_SHA" ]; then
            msg="docs-live is at $head now, not $PUBLISH_SHA. Re-run the workflow run for $head instead."
            echo "::notice title=Docs site not promoted::$msg"
            echo "### Docs site not promoted: $msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm dlx "$VERCEL_CLI" promote "$URL" --yes --token="$VERCEL_TOKEN"
          echo "### Docs site live: $PUBLISH_SHA ($URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: 📣 Report a failed deploy
        if: failure()
        env:
          PUBLISH_SHA: ${{ needs.publish.outputs.deploy_sha }}
        run: |
          msg="The docs site production deploy of $PUBLISH_SHA failed. The previous deployment is still serving; Mintlify publishing from docs-live is unaffected."
          echo "::error title=Docs site deploy failed::$msg"
          echo "### Docs site deploy failed" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg Re-run this job once the cause is fixed." >> "$GITHUB_STEP_SUMMARY"
