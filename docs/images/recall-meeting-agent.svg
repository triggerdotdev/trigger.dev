<path id="edge-recall-page" d="M 450 74 L 620 74 L 620 238" fill="none" stroke="#878C99" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow-muted)"/>
<path id="edge-page-recall" d="M 560 238 L 560 96 L 450 96" fill="none" stroke="#7655fd" stroke-width="1.5" marker-end="url(#arrow-lavender)"/>
