<text x="230" y="116" text-anchor="middle" fill="#E8E9EC" font-family="'Geist Mono', Menlo, monospace" font-size="12" font-weight="700">2</text>
<text x="246" y="116" text-anchor="start" fill="#7655fd" font-family="'Geist Mono', Menlo, monospace" font-size="12">fetch note + transcript</text>
