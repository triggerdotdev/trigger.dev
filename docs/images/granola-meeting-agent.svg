  </marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
    <path d="M 1.5 1.5 L 7 5 L 1.5 8.5" fill="none" stroke="#878C99" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
